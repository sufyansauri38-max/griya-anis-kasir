services:
  - type: web
    name: griya-anis-kasir
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_PIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
